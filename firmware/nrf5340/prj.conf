# RigTether M1 nRF5340 DK application-core fixture.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RigTether M1"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_BUF_ACL_RX_SIZE=521
CONFIG_BT_BUF_ACL_TX_SIZE=521
CONFIG_BT_CTLR=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_WATCHDOG=y
CONFIG_NRFX_TIMER2=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y

CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PRINTK=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_CDC_ACM=n

# The canonical UAC1 descriptor is exported and validated here. Enabling the
# deprecated legacy class for physical enumeration is an explicit #18 build gate.
CONFIG_USB_DEVICE_STACK=n

# No electrical PTT pin is selected until #13 supplies the radio-disconnected
# fixture evidence. A local overlay may enable it only for that human-required work.
CONFIG_RIGTETHER_PTT_OUTPUT_ENABLED=n
CONFIG_RIGTETHER_FAULT_INJECTION=n
